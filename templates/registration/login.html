{% extends "base.html" %}
{% block title %}Login - ShopBill{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title">Login</h2>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
        <p class="mt-2 text-muted">Demo: owner/demo123 (Owner), staff/demo123 (Staff).</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
