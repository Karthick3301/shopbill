{% extends "base.html" %}
{% block title %}Login - ShopBill{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card login-card">
      <div class="card-body">
        <div class="text-center mb-3">
          <span class="login-brand-icon" aria-hidden="true"><i class="bi bi-receipt-cutoff"></i></span>
          <h1 class="h4 mb-0 mt-2">ShopBill</h1>
          <p class="text-muted small mb-0">Sign in to continue</p>
        </div>
        <h2 class="h6 card-heading">Login</h2>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>Login</button>
        </form>
        <p class="mt-3 mb-0 text-muted small text-center">Demo: owner/demo123 (Owner), staff/demo123 (Staff).</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
