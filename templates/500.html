{% extends "base.html" %}
{% block title %}Server error - ShopBill{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card error-card"><div class="card-body text-center py-5">
      <span class="error-icon" aria-hidden="true"><i class="bi bi-exclamation-triangle"></i></span>
      <h1 class="display-4">500</h1>
      <p class="lead">Something went wrong on our side.</p>
      <p class="text-muted">Please try again, or come back later.</p>
      <a class="btn btn-primary" href="{% url 'home' %}"><i class="bi bi-house me-1" aria-hidden="true"></i>Back to home</a>
    </div></div>
  </div>
</div>
{% endblock %}
